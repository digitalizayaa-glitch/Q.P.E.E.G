name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sintaxis y caché del service worker al día
        run: npm run check
      - name: Pruebas de lógica
        run: npm test
      - name: Instalar navegador de pruebas
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Pruebas de interfaz
        run: npm run test:e2e

  safari:
    name: Pruebas de interfaz en Safari (WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar WebKit
        run: |
          pip install playwright
          python -m playwright install --with-deps webkit
      - name: Pruebas de interfaz con el motor de Safari
        env:
          BROWSER: webkit
        run: |
          fail=0
          for t in tests/e2e/test_*.py; do
            echo "::group::$t"
            if ! python "$t"; then
              echo "::warning::$t falló en WebKit; segundo intento (tiempos del runner)"
              python "$t" || { echo "::error::$t falló en WebKit dos veces"; fail=1; }
            fi
            echo "::endgroup::"
          done
          exit $fail
