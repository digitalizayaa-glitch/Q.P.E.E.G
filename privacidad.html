<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q.P.E.E.G · Privacidad y salud</title>
    <link rel="icon" href="icons/icon-192.png">
    <style>
        body { margin: 0; background: #181818; color: #eee; font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        main { max-width: 680px; margin: 0 auto; padding: 32px 20px 56px; }
        h1 { font-size: 24px; letter-spacing: 3px; margin: 0 0 4px; }
        h2 { font-size: 20px; margin: 36px 0 8px; color: #fff; }
        h3 { font-size: 16px; margin: 20px 0 4px; }
        p { margin: 0 0 10px; color: #cfcfcf; white-space: pre-line; }
        .muted { color: #8f8f8f; font-size: 14px; }
        a { color: #4fd17e; }
    </style>
</head>
<body>
<main>
    <h1>Q.P.E.E.G</h1>
    <p class="muted" id="updated"></p>
    <div id="docs"></div>
    <p class="muted"><a href="./">Abrir la app</a></p>
</main>
<script src="scripts/app/legal.js"></script>
<script>
    document.getElementById("updated").textContent = `Actualizado el ${LEGAL_UPDATED}`;
    const docs = document.getElementById("docs");
    for (const key of ["privacy", "health"]) {
        const h2 = document.createElement("h2");
        h2.id = key === "privacy" ? "privacidad" : "salud";
        h2.textContent = LEGAL[key].title;
        docs.appendChild(h2);
        for (const [h, p] of LEGAL[key].sections) {
            const h3 = document.createElement("h3");
            h3.textContent = h;
            const para = document.createElement("p");
            para.textContent = p;
            docs.append(h3, para);
        }
    }
</script>
</body>
</html>
